# Argo executor 使用独立身份；控制器本身的 CRD 权限按集群安装方式授予。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-vision-workflow
---
# executor 回写结果仅需当前命名空间内创建与修补 WorkflowTaskResult。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: store-vision-workflow-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: store-vision-workflow-executor
subjects:
  - kind: ServiceAccount
    name: store-vision-workflow
roleRef:
  kind: Role
  name: store-vision-workflow-executor
  apiGroup: rbac.authorization.k8s.io
