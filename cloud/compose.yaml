services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_ROOT_PASSWORD: ${SV_MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: store_vision
      MYSQL_USER: store_vision
      MYSQL_PASSWORD: ${SV_MYSQL_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${SV_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${SV_S3_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
volumes:
  mysql-data:
  minio-data:
