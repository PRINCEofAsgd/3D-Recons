[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "store-vision"
version = "1.0.3"
description = "多相机门店标定、白色桌子检测、2.5D 地图与俯视拼接原型"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
  "scipy>=1.11,<2",
  "PyQt6>=6.5,<7",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<10",
  "pytest-timeout>=2.3,<3",
]
colmap = ["pycolmap>=0.6"]

[project.scripts]
store-vision = "store_vision.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["store_vision*"]

[tool.setuptools.package-data]
store_vision = ["assets/*.png", "assets/*.icns", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 30
